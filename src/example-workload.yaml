apiVersion: v1
kind: Pod
metadata:
  name: oferta-app
  labels:
    app: oferta
spec:
  containers:
  - name: oferta
    image: eclipse-temurin:21-jre
    command: ["sh", "-c", "sleep 3600"]
    resources:
      requests:
        cpu: "1000m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "512Mi"
    resizePolicy:
    - resourceName: cpu
      restartPolicy: NotRequired