apiVersion: apps/v1
kind: Deployment
metadata:
  name: startup-cpu-operator
  namespace: kube-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: startup-cpu-operator
  template:
    metadata:
      labels:
        app: startup-cpu-operator
    spec:
      serviceAccountName: startup-cpu-operator
      containers:
      - name: manager
        image: ghcr.io/livistondias/startup-cpu-operator:latest
        command:
        - /manager
        args:
        - --leader-elect
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          runAsNonRoot: true
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
      securityContext:
        runAsUser: 65532
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: startup-cpu-operator
              topologyKey: kubernetes.io/hostname